services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: webhook-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env}
    ports:
      - "${SQLSERVER_PORT:-1433}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  api:
    build:
      context: .
      args:
        PROJECT: src/Api/WebhookDelivery.Api.csproj
        ENTRYPOINT_DLL: WebhookDelivery.Api.dll
    container_name: webhook-api
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=${DATABASE_NAME:-WebhookDelivery};User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;"
      Database__ApplyMigrationsOnStartup: "true"
      Delivery__BatchSize: ${DELIVERY_BATCH_SIZE:-50}
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8080/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  worker:
    build:
      context: .
      args:
        PROJECT: src/Worker/WebhookDelivery.Worker.csproj
        ENTRYPOINT_DLL: WebhookDelivery.Worker.dll
    container_name: webhook-worker
    depends_on:
      api:
        condition: service_healthy
    environment:
      DOTNET_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=${DATABASE_NAME:-WebhookDelivery};User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;"
      Delivery__BatchSize: ${DELIVERY_BATCH_SIZE:-50}
      Delivery__DisableEndpointAfterConsecutiveFailures: ${DISABLE_ENDPOINT_AFTER_FAILURES:-20}
    restart: unless-stopped

  # A stand in for a customer's server, so deliveries can be watched arriving.
  receiver:
    image: mendhak/http-https-echo:35
    container_name: webhook-receiver
    environment:
      HTTP_PORT: 8080
    ports:
      - "${RECEIVER_PORT:-9090}:8080"

volumes:
  sqlserver-data:

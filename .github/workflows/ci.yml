name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Run tests
        run: dotnet test --configuration Release --no-build --verbosity normal

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build API image
        run: |
          docker build \
            --build-arg PROJECT=src/Api/WebhookDelivery.Api.csproj \
            --build-arg ENTRYPOINT_DLL=WebhookDelivery.Api.dll \
            -t webhook-delivery-api:ci .

      - name: Build worker image
        run: |
          docker build \
            --build-arg PROJECT=src/Worker/WebhookDelivery.Worker.csproj \
            --build-arg ENTRYPOINT_DLL=WebhookDelivery.Worker.dll \
            -t webhook-delivery-worker:ci .

  end-to-end:
    name: Deliver a webhook end to end
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create .env
        run: sed 's/your_password_here/CiPipeline_2026!/g' .env.example > .env

      - name: Start the stack
        run: docker compose up -d --build

      - name: Wait for the API
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:8080/health/live > /dev/null 2>&1; then
              echo "API is ready."
              exit 0
            fi
            sleep 3
          done

          echo "API did not become ready."
          docker compose logs api
          exit 1

      - name: Register an endpoint, publish an event, verify the delivery
        run: bash scripts/smoke-test.sh

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail=80

      - name: Tear down
        if: always()
        run: docker compose down -v
